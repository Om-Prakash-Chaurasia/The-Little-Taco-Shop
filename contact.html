<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact Us</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Om Prakash Chaurasia" />
    <meta
      name="description"
      content="Contact information for The Little Taco Shop"
    />
    <link rel="icon" href="favicon\taco.ico" type="favicon" />
  </head>
  <body>
    <header>
      <h1>Contact Us</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="/#about">About LTS</a></li>
          <li><a href="/#menu">Our Menu</a></li>
          <li><a href="hours.html">Store Hours</a></li>
        </ul>
      </nav>
      <figure>
        <img
          src="1000_F_438482964_ON2xBrCcstypbAg0371I9EVNvaC9Yrqm.jpg"
          alt="Little Taco Shop Tacos!"
          title="Tacos ready to eat!"
          width="400"
          height="267"
        />
        <figcaption>Little Taco Shop Tacos</figcaption>
      </figure>
    </header>
    <hr />
    <main>
      <section>
        <h2>Our contact form</h2>
        <form>
          <fieldset>
            <legend>Send Us A Message</legend>
            <div>
              <lable for="name">Name :</lable>
              <input type="text" id="name" placeholder="Your Name" required />
            </div>
            <br />
            <div>
              <lable for="email">Email :</lable>
              <input
                type="email"
                id="email"
                placeholder="Your Email"
                required
              />
            </div>
            <br />
            <div>
              <lable for="message">Your Message :</lable>
              <br />
              <textarea
                cols="30"
                rows="10"
                placeholder="Type your messasge here"
              ></textarea>
            </div>
          </fieldset>
          <button type="submit">Send</button>
          <button type="reset">Reset</button>
        </form>
      </section>
      <section>
        <h2>Our Location</h2>
        <address>
          555 Taco Temptation Lane, Suite T Kanas City, MO 55555-5555
          <br />
          <br />Phone :<a href="tel:+5555555555">555-555-5555</a>
        </address>
        <br />
      </section>
    </main>
    <hr />
    <footer>
      <p>Copyright @ The Little Taco Shop</p>
    </footer>
  </body>
</html>
